<!DOCTYPE html>
<html>
<head>
    <title>Albums</title>
    <link rel="stylesheet" href="style.css">
</head>
<header>
    <nav>
    <a class="navbox" href="index.html">Home</a>
    <a class="navbox" href="artists.html">Artists</a>
    <a class="navbox" href="albums.html">Albums</a>
    <a class="navbox" href="songs.html">Songs</a>
    </nav>
</header>

<body>
    <h1>Albums</h1>

    <!--CREATE ALBUM-->
    <section class="card">
        <h2>Create Album</h2>
        <form onsubmit="event.preventDefault(); createAlbum();">
            <input id="createName" placeholder="Album Name">
            <input id="createYear" placeholder="Release Year">
            <input id="createListens" placeholder="Listens">
            <input id="createArtistId" placeholder="Artist ID">
            <button type="submit">Create</button>
        </form>
    </section>

    <!--UPDATE ALBUM-->
    <section class="card">
        <h2>Update Album</h2>
        <form onsubmit="event.preventDefault(); updateAlbum();">
            <input id="updateId" placeholder="Album ID">
            <input id="updateName" placeholder="New Name">
            <input id="updateYear" placeholder="New Year">
            <input id="updateListens" placeholder="New Listens">
            <input id="updateArtistId" placeholder="New Artist ID">
            <button type="submit">Update</button>
        </form>
    </section>

    <!--DELETE ALBUM-->
    <section class="card">
        <h2>Delete Album</h2>
        <form onsubmit="event.preventDefault(); deleteAlbum();">
            <input id="deleteId" placeholder="Album ID">
            <button type="submit">Delete</button>
        </form>
    </section>

    <!--GET ALBUM BY ID-->
    <section class="card">
        <h2>Find Album by ID</h2>
        <form onsubmit="event.preventDefault(); getAlbumById();">
            <input id="searchAlbumId" placeholder="Album ID">
            <button type="submit">Search</button>
        </form>
        <div id="singleAlbumResult"></div>
    </section> 

    <!--GET ALL ALBUMS-->
    <section>
        <h2>All Albums</h2>
        <button onclick="loadAlbums()">Show All Albums</button>
        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Year</th>
                    <th>Listens</th>
                    <th>Artist ID</th>
                </tr>
            </thead>
            <tbody id="albumsTable"></tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
