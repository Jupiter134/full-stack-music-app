<!DOCTYPE html>
<html>
<head>
    
    <link rel="stylesheet" href="style.css">
</head>
<header>
    <nav>
    <a class="navbox" href="index.html">Home</a>
    <a class="navbox" href="artists.html">Artists</a>
    <a class="navbox" href="albums.html">Albums</a>
    <a class="navbox" href="songs.html">Songs</a>
    </nav>
</header>
<body>
    <h1>Songs</h1>

    <!--CREATE SONG-->
    <section class="card">
        <h2>Create Song</h2>
        <form onsubmit="event.preventDefault(); createSong();">
            <input id="createName" placeholder="Song Name">
            <input id="createYear" placeholder="Release Year">
            <input id="createAlbumId" placeholder="Album ID">
            <button type="submit">Create</button>
        </form>
    </section>

    <!--UPDATE SONG-->
    <section class="card">
        <h2>Update Song</h2>
        <!--preventDefault() -> use backend code, not default-->
        <form onsubmit="event.preventDefault(); updateSong()">
            <input id="updateId" placeholder="Song ID">
            <input id="updateName" placeholder="New Name">
            <input id="updateYear" placeholder="New Year">
            <input id="updateAlbumId" placeholder="New Album ID">
            <button type="submit">Update</button>
        </form>
    </section>

    <!--DELETE SONG-->
    <section class="card">
        <h2>Delete Song</h2>
        <form onsubmit="event.preventDefault(); deleteSong();">
            <input id="deleteId" placeholder="Song ID">
            <button type="submit">Delete</button>
        </form>
    </section>

    <!--GET SONG BY ID-->
    <section class="card">
        <h2>Find Song by ID</h2>
        <form onsubmit="event.preventDefault(); getSongById();">
            <input id="searchSongId" placeholder="Song ID">
            <button type="submit">Search</button>
        </form>
        <div id="singleSongResult"></div>
    </section>

    <!--GET ALL SONGS-->
    <section class="card">
        <h2>All Songs</h2>
        <button onclick="loadSongs()">Show All Songs</button>
        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Year</th>
                    <th>Album ID</th>
                </tr>
            </thead>
            <tbody id="songsTable"></tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
